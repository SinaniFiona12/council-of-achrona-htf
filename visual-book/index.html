<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>De Kroniek van Achrona</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Alegreya+SC:wght@400;700&family=Alegreya:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="scene"></div>
  <div class="korrel" aria-hidden="true"></div>
  <div class="vignet" aria-hidden="true"></div>

  <h1 id="titel" class="titel">De Kroniek van Achrona</h1>
  <div id="status" class="status"></div>

  <!-- linkerpagina: de Koning en zijn kantlijn -->
  <aside id="kantlijn" class="kantlijn" aria-label="Open vragen van de Koning">
    <h2>Open vragen</h2>
    <ul id="vragen"></ul>
  </aside>
  <div id="bevel" class="bevel" hidden>
    <div class="bevel-aan" id="bevel-aan"></div>
    <p class="bevel-reden"><span class="veer" aria-hidden="true">✒</span><span id="bevel-reden"></span></p>
  </div>

  <!-- rechterpagina: de spreker -->
  <div id="ballon" class="ballon" hidden>
    <div class="ballon-kop"><span class="ruit" id="ballon-ruit"></span><span id="ballon-naam"></span><span class="tools" id="ballon-tools"></span></div>
    <p class="ballon-kern" id="ballon-kern"></p>
    <div class="ballon-ids" id="ballon-ids"></div>
  </div>

  <!-- ruwe trace-beurt (klik op een element) -->
  <aside id="paneel" class="paneel" hidden>
    <button class="sluit" id="paneel-sluit" aria-label="Sluiten">×</button>
    <h2 id="paneel-titel">Trace</h2>
    <div id="paneel-inhoud"></div>
  </aside>

  <!-- de vonnispagina -->
  <div id="vonnis" class="vonnis" hidden>
    <div class="vonnis-blad" id="vonnis-blad"></div>
    <button class="sluit" id="vonnis-sluit" aria-label="Sluiten">×</button>
  </div>

  <div id="bediening" class="bediening">
    <button id="k-speel" title="Afspelen / pauzeren (spatie)">❚❚</button>
    <button id="k-live" title="Live: volg de lopende run">Live</button>
    <button id="k-snel" title="Snelheid">1×</button>
    <button id="k-geluid" title="Geluid aan/uit">🔇</button>
    <button id="k-lite" title="Lite: minder effecten">Lite</button>
    <button id="k-vonnis" title="Toon het vonnis" disabled>Vonnis</button>
  </div>
  <div id="fps" class="fps" hidden></div>
  <div id="leeg" class="leeg" hidden>Wachten op <code>trace.json</code>…<br /><small>Start <code>uv run council</code> in de root van de repo.</small></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
